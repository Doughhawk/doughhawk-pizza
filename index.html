<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120d0b">
<title>DoughHawk Pizza Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#120d0b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}
body{display:flex;justify-content:center}.app{width:100%;max-width:620px;min-height:100vh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{text-align:center;padding:12px 0 8px}.logo{font-weight:1000;font-size:34px;letter-spacing:-2px}.logo span{color:#f6a623}.sub{font-size:11px;color:#b8a99d}
.card{background:linear-gradient(145deg,#2a201a,#1b1411);border:1px solid #4c382b;border-radius:20px;padding:14px;margin:9px 0;box-shadow:0 10px 28px #0007}
h1,h2,p{margin:6px 0}.hint{font-size:12px;color:#bfaea1}.scene{height:410px;position:relative;overflow:hidden;border-radius:16px;background:radial-gradient(circle at 35% 35%,#38241a,#17100d 65%)}
.oven{position:absolute;right:4%;top:9%;width:29%;height:70%;border:7px solid #54483f;border-radius:14px;background:#27221e;box-shadow:inset 0 0 25px #000}.door{position:absolute;left:10%;right:10%;top:18%;height:58%;border:3px solid #765d4e;border-radius:10px;background:radial-gradient(circle,#6b1d11,#140706 70%)}.fire{position:absolute;bottom:5%;width:100%;text-align:center;font-size:38px;animation:f .2s infinite alternate}@keyframes f{to{transform:scale(1.1)}}
.pizza{position:absolute;z-index:3;left:5%;top:18%;width:57vw;height:57vw;max-width:285px;max-height:285px;border-radius:50%;background:#dda05a;border:14px solid #c17b3c;box-shadow:0 15px 30px #000a;transition:.4s}.pizza:before{content:"";position:absolute;inset:10px;border-radius:50%;background:#a92d21}.cheese{position:absolute;z-index:2;inset:22px;border-radius:50%;background:#f2c74c}.t{position:absolute;z-index:4;width:27px;height:27px;border-radius:50%;background:#aa2720;box-shadow:0 2px 5px #421}.basil{background:#27753d!important;border-radius:90% 0!important}.jal{background:#62a33d!important;border:3px solid #396f28}.chicken{background:#bd8148!important;border-radius:7px!important}
.row{display:flex;gap:7px}.btn{flex:1;min-height:48px;border:0;border-radius:12px;background:#3a2b22;color:#fff;font-size:15px;font-weight:900}.btn:active{transform:scale(.96)}.primary{background:#f6a623;color:#17110d}.meter{height:9px;background:#392a22;border-radius:10px;overflow:hidden;margin-top:7px}.fill{height:100%;width:0;background:#f6a623}.status{text-align:center;font-size:13px;font-weight:800;min-height:18px}
.overlay{display:none;position:absolute;z-index:20;inset:0;background:#120d0deb;align-items:center;justify-content:center;text-align:center}.overlay.show{display:flex}.score{font-size:68px;font-weight:1000;color:#f6a623}.again{border:0;border-radius:13px;background:#f6a623;color:#17110d;font-weight:1000;padding:15px 24px;font-size:16px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">DOUGH<span>HAWK</span></div><div class="sub">PIZZA ARCADE • TOUCH • BAKE • SCORE</div></header>

<div class="card">
<div class="scene" id="scene">
<div class="pizza" id="pizza"><div class="cheese"></div></div>
<div class="oven"><div class="door"></div><div class="fire">🔥</div></div>
<div class="overlay" id="overlay"><div><div class="score" id="score">0</div><h2 id="result"></h2><p id="details" class="hint"></p><button class="again" onclick="location.reload()">NY PIZZA 🍕</button></div></div>
</div>
</div>

<div class="card">
<div class="status" id="status">Vælg toppings</div>
<div class="row">
<button class="btn" onclick="add('pepperoni')">🍅</button>
<button class="btn" onclick="add('basil')">🌿</button>
<button class="btn" onclick="add('jal')">🌶️</button>
<button class="btn" onclick="add('chicken')">🍗</button>
<button class="btn" onclick="resetPizza()">↩</button>
</div>
<div class="row" style="margin-top:7px">
<button class="btn" onclick="setTemp(350)">350°</button>
<button class="btn" onclick="setTemp(450)">450°</button>
<button class="btn" onclick="setTemp(500)">500°</button>
<button class="btn primary" id="bake" onclick="bake()">🔥 BAG</button>
</div>
<div class="meter"><div class="fill" id="fill"></div></div>
</div>

<div class="card"><p class="hint">Tip: 450°C er standard. Prøv at ramme det perfekte bagetidspunkt.</p></div>
</div>

<script>
let temp=450,count=0,running=false,t=0,timer;
function setTemp(v){if(running)return;temp=v;document.getElementById('status').textContent=v+'°C valgt'}
function add(type){if(running)return;let e=document.createElement('div');e.className='t '+type;let a=Math.random()*6.283,r=20+Math.random()*28;e.style.left=(50+Math.cos(a)*r)+'%';e.style.top=(50+Math.sin(a)*r)+'%';document.getElementById('pizza').appendChild(e);count++;document.getElementById('status').textContent=count+' toppings'}
function resetPizza(){if(running)return;document.querySelectorAll('.t').forEach(e=>e.remove());count=0;document.getElementById('status').textContent='Vælg toppings'}
function bake(){if(running)return;running=true;t=0;document.getElementById('pizza').style.animation='shake .12s infinite';document.getElementById('bake').textContent='🛑 STOP';timer=setInterval(()=>{t+=.1;let ideal=temp===500?1.6:temp===450?2.3:3.1;document.getElementById('fill').style.width=Math.min(100,t/ideal*100)+'%';document.getElementById('status').textContent=t.toFixed(1)+' sek • '+temp+'°C';if(t>=ideal*1.55)finish()},100);document.getElementById('bake').onclick=finish}
function finish(){clearInterval(timer);running=false;document.getElementById('pizza').style.animation='';let ideal=temp===500?1.6:temp===450?2.3:3.1;let timing=Math.max(0,55-Math.abs(t-ideal)*24);let score=Math.max(0,Math.min(100,Math.round(20+timing+Math.min(25,count*6))));document.getElementById('score').textContent=score;document.getElementById('result').textContent=score>=90?'DOUGHHAWK LEGEND 🏆':score>=75?'PIZZA MASTER 🔥':score>=55?'SOLID PIZZA 🍕':'BACK TO THE OVEN 😅';document.getElementById('details').textContent=t.toFixed(1)+' sek • '+temp+'°C • '+count+' toppings';document.getElementById('overlay').classList.add('show')}
</script>
</body>
</html>
